<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarkari Sathi India</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef2f7;
}

/* Banner */
.banner{
    width:100%;
}

/* Search */
.search-box{
    text-align:center;
    padding:15px;
}
.search-box input{
    width:80%;
    padding:12px;
    border-radius:30px;
    border:none;
}
.search-box button{
    padding:12px 20px;
    border:none;
    border-radius:30px;
    background:#0d47a1;
    color:white;
}

/* Cards */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    padding:15px;
}

.card{
    background:white;
    padding:15px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card a{
    text-decoration:none;
    color:black;
    font-weight:bold;
}

/* Footer */
footer{
    background:#0d47a1;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>

<body>

<img src="banner.png" class="banner">

<div class="search-box">
<input placeholder="Search services...">
<button>Search</button>
</div>

<div class="grid">

<div class="card"><a href="https://uidai.gov.in">Aadhaar Card</a></div>
<div class="card"><a href="https://beneficiary.nha.gov.in">Ayushman Card</a></div>
<div class="card"><a href="https://www.nvsp.in">Voter ID</a></div>
<div class="card"><a href="https://nfsa.gov.in">Ration Card</a></div>
<div class="card"><a href="https://www.onlineservices.nsdl.com">PAN Card</a></div>
<div class="card"><a href="https://scholarships.gov.in">Scholarship</a></div>

</div>

<footer>
© 2026 Sarkari Sathi India | Ravi Kardam
</footer>

</body>
</html>
